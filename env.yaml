name: subcell
channels:
  - pytorch
  - nvidia
  - conda-forge
dependencies:
  - python
  - micro_sam
  - einops
  - pytorch==2.4.1
  - torchvision==0.19.1
  - geckodriver
  - firefox
  #- pytorch-cuda=12            # needs to match your driver CUDA (check with nvidia-smi)
  - pip
  - pip:
    - bioio
    - bioio-lif
    - bioio-ome-tiff
    - bioio-tifffile
    - boto3
    - transformers==4.45.1  # more recent version have problems with imports
    - panel
    - holoviews
    - bokeh
    - umap-learn
    - selenium